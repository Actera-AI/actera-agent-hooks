name: ci
"on":
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 24
        include:
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Verify bundled scanners
        run: node scripts/bundle-gitleaks.mjs
        timeout-minutes: 5
      - name: Contract and offline suites
        run: npm test
        shell: bash
        timeout-minutes: 5
      - name: Packed payload
        run: npm run check:package
        timeout-minutes: 5
    timeout-minutes: 15
  scanner-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.0
          cache-dependency-path: scanner/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: go vet ./...
        working-directory: scanner
        timeout-minutes: 5
      - run: node scripts/scanner-notices.mjs --check
        timeout-minutes: 5
      - name: Verify reproducible helper binaries
        run: node scripts/bundle-gitleaks.mjs --verify-build
        timeout-minutes: 10
    timeout-minutes: 15
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: bash scripts/scan-secrets.sh
        timeout-minutes: 5
    timeout-minutes: 10
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test .github/scripts/*.test.mjs
        timeout-minutes: 5
    timeout-minutes: 10
  # The one check that protection on main requires. It runs on every event and
  # passes only when each job above passed.
  ci-result:
    if: ${{ always() }}
    needs:
      - package
      - scanner-source
      - secrets
      - release-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do test "$result" = success; done
        timeout-minutes: 5
  # The release workflow publishes a tag only when this job passed for its exact
  # commit, so a release always reuses full CI on main.
  release-ready:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs:
      - package
      - scanner-source
      - secrets
      - release-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Full CI passed for $GITHUB_SHA; releases may reuse this exact commit."
        timeout-minutes: 5
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancelling a run on main would leave its commit without release evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
