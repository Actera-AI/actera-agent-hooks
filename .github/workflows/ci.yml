name: ci
"on":
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 24
        include:
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Verify bundled scanners
        run: node scripts/bundle-gitleaks.mjs
        timeout-minutes: 5
      - name: Contract and offline suites
        run: npm test
        shell: bash
        timeout-minutes: 5
      - name: Packed payload
        run: npm run check:package
        timeout-minutes: 5
    timeout-minutes: 15
  scanner-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.0
          cache-dependency-path: scanner/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: go vet ./...
        working-directory: scanner
        timeout-minutes: 5
      - run: node scripts/scanner-notices.mjs --check
        timeout-minutes: 5
      - name: Verify reproducible helper binaries
        run: node scripts/bundle-gitleaks.mjs --verify-build
        timeout-minutes: 10
    timeout-minutes: 15
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: bash scripts/scan-secrets.sh
        timeout-minutes: 5
    timeout-minutes: 10
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
